<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Bet - Admin Girişi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e94560;
            --primary-light: #ff6b81;
            --bg-primary: #0a0b0e;
            --bg-secondary: #12141a;
            --bg-card: #1a1d26;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #6b7280;
            --border-color: rgba(255, 255, 255, 0.06);
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(233, 69, 96, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            animation: bgRotate 30s linear infinite;
        }

        @keyframes bgRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; animation-duration: 25s; }
        .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 2s; animation-duration: 20s; }
        .particle:nth-child(3) { left: 60%; top: 10%; animation-delay: 4s; animation-duration: 22s; }
        .particle:nth-child(4) { left: 70%; top: 60%; animation-delay: 1s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 90%; top: 30%; animation-delay: 3s; animation-duration: 24s; }
        .particle:nth-child(6) { left: 40%; top: 90%; animation-delay: 5s; animation-duration: 21s; }
        .particle:nth-child(7) { left: 85%; top: 85%; animation-delay: 2.5s; animation-duration: 19s; }
        .particle:nth-child(8) { left: 5%; top: 50%; animation-delay: 1.5s; animation-duration: 23s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-25px) translateX(15px); opacity: 0.5; }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(26, 29, 38, 0.95) 0%, rgba(18, 20, 26, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            position: relative;
            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.6) 0%, rgba(233, 69, 96, 0) 70%);
            border-radius: 50%;
            filter: blur(25px);
            animation: logoGlow 3s ease-in-out infinite;
            z-index: -1;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5)) drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
        }

        @keyframes logoGlow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Welcome Text */
        .welcome-text {
            text-align: center;
            margin-bottom: 32px;
        }

        .welcome-text h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Typing Animation */
        .typing-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 26px;
        }

        .typing-text {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.95rem;
            color: var(--success);
            border-right: 2px solid var(--primary);
            padding-right: 4px;
            animation: blink 0.75s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary); }
        }

        /* Form Styles */
        .login-form {
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-primary);
            background: rgba(18, 20, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.15);
            background: rgba(18, 20, 26, 1);
        }

        .form-control:focus + .input-icon,
        .form-control:not(:placeholder-shown) + .input-icon {
            color: var(--primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* Submit Button */
        .btn-login {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login span {
            position: relative;
            z-index: 1;
        }

        .btn-login i {
            position: relative;
            z-index: 1;
        }

        /* Loading State */
        .loading-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .loading-screen.active {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .loading-text strong {
            color: var(--primary);
        }

        /* Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .security-badge i {
            color: var(--success);
            font-size: 0.9rem;
        }

        .security-badge span {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        /* Responsive */
        @media (max-height: 750px) {
            .logo-icon {
                width: 100px;
                height: 100px;
            }

            .logo-icon::before {
                width: 80px;
                height: 80px;
            }

            .login-card {
                padding: 24px 30px;
            }

            .logo-area {
                margin-bottom: 12px;
            }

            .typing-container {
                margin-bottom: 12px;
            }

            .form-group {
                margin-bottom: 12px;
            }

            .form-control {
                padding: 10px 16px 10px 44px;
            }

            .btn-login {
                padding: 12px 20px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
            }

            .logo-icon {
                width: 100px;
                height: 100px;
            }

            .logo-icon::before {
                width: 80px;
                height: 80px;
            }

            .logo-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation"></div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Login Card -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">
                    <img src="/logo.png" alt="Clash Bet Logo">
                </div>
                <div class="logo-text">CLASH BET</div>
                <div class="logo-subtitle">Admin Panel</div>
            </div>

            <div class="typing-container">
                <span class="typing-text" id="typingText"></span>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Giriş bilgileri hatalı!</span>
            </div>

            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="username" placeholder="admin" required autocomplete="username">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Şifre</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>Giriş Yap</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <p class="loading-text">
                    <strong>Hoşgeldin, Patron!</strong><br>
                    Sistem hazırlanıyor...
                </p>
            </div>

            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>256-BIT SSL KORUMALI | SECURE ACCESS v3.0</span>
            </div>
        </div>
    </div>

    <script>
        // Typing Animation
        const texts = [
            "Hoşgeldin, Patron.",
            "Sistem hazır.",
            "Güvenli giriş...",
            "CLASH BET Admin"
        ];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingSpeed = 100;
        const deletingSpeed = 50;
        const pauseTime = 2000;

        function typeText() {
            const typingElement = document.getElementById('typingText');
            const currentText = texts[textIndex];

            if (isDeleting) {
                typingElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            if (!isDeleting && charIndex === currentText.length) {
                setTimeout(() => {
                    isDeleting = true;
                    typeText();
                }, pauseTime);
                return;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
            }

            setTimeout(typeText, isDeleting ? deletingSpeed : typingSpeed);
        }

        function redirectToDashboard(target = '/admin/dashboard') {
            try {
                window.location.replace(target);
            } catch (error) {
                window.location.href = target;
            }
        }

        // Start typing animation + skip login if token is already valid
        document.addEventListener('DOMContentLoaded', async () => {
            typeText();

            const existingToken = localStorage.getItem('token');
            if (!existingToken) {
                return;
            }

            try {
                const response = await fetch('/api/admin/session', {
                    headers: { 'Authorization': 'Bearer ' + existingToken }
                });

                if (response.ok) {
                    redirectToDashboard('/admin/dashboard');
                    return;
                }
            } catch (error) {
                console.warn('Stored admin token validation failed:', error);
            }

            localStorage.removeItem('token');
        });

        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginForm = document.getElementById('loginForm');
            const loadingScreen = document.getElementById('loadingScreen');
            const typingContainer = document.querySelector('.typing-container');

            // Hide error message
            errorMessage.classList.remove('show');

            // Show loading
            loginForm.classList.add('hidden');
            typingContainer.style.display = 'none';
            loadingScreen.classList.add('active');

            try {
                const response = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    const redirectTarget = data.redirect || '/admin/dashboard';

                    // Store token
                    localStorage.setItem('token', data.token);

                    // Redirect immediately, with a short fallback for throttled webviews.
                    redirectToDashboard(redirectTarget);
                    setTimeout(() => {
                        redirectToDashboard(redirectTarget);
                    }, 400);
                } else {
                    // Show error
                    loadingScreen.classList.remove('active');
                    loginForm.classList.remove('hidden');
                    typingContainer.style.display = 'flex';

                    document.getElementById('errorText').textContent = data.error || 'Giriş başarısız!';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);

                loadingScreen.classList.remove('active');
                loginForm.classList.remove('hidden');
                typingContainer.style.display = 'flex';

                document.getElementById('errorText').textContent = 'Sunucu hatası! Lütfen tekrar deneyin.';
                errorMessage.classList.add('show');
            }
        }

        // Add input animation
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
