<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slot Oyunları | CLASH BET</title>
    <meta name="description" content="En popüler slot oyunlarını Clash Bet'te oyna. Sweet Bonanza, Gates of Olympus, Big Bass ve daha fazlası.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <style>
        body { background: #0b0e14; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }

        /* Page Layout */
        .page-container { max-width: 1200px; margin: 0 auto; padding: 0 12px 100px 12px; }

        /* Page Header */
        .page-hero {
            padding: 24px 20px;
            background: linear-gradient(135deg, rgba(245,197,24,0.06) 0%, rgba(15,23,42,0.95) 50%, rgba(139,92,246,0.06) 100%);
            border: 1px solid rgba(245,197,24,0.1);
            border-radius: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .page-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(245,197,24,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .page-hero-content { position: relative; z-index: 1; }
        .page-hero h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #f5c518, #fef08a, #f5c518);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            animation: shimmerText 3s linear infinite;
            margin: 0;
        }
        .page-hero p { color: #64748b; font-size: 12px; font-weight: 600; margin-top: 4px; }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-box-lg {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box-lg input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            border: 1px solid rgba(245,197,24,0.2);
            background: rgba(15,23,42,0.8);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
        }
        .search-box-lg input:focus { border-color: #f5c518; box-shadow: 0 0 20px rgba(245,197,24,0.15); }
        .search-box-lg input::placeholder { color: #4a5568; }
        .search-box-lg svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #64748b;
            pointer-events: none;
        }

        .sort-select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15,23,42,0.8);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }
        .sort-select option { background: #1e293b; }

        /* Layout with Sidebar */
        .page-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 16px;
        }

        /* Sidebar */
        .filter-sidebar {
            background: linear-gradient(180deg, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .filter-sidebar h3 {
            font-size: 11px;
            font-weight: 900;
            color: #f5c518;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(245,197,24,0.15);
        }
        .provider-filter-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 400px;
            overflow-y: auto;
        }
        .provider-filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
        }
        .provider-filter-item:hover { background: rgba(245,197,24,0.06); color: #e2e8f0; }
        .provider-filter-item.active { background: rgba(245,197,24,0.12); color: #f5c518; font-weight: 800; }
        .provider-filter-item .pf-count {
            margin-left: auto;
            font-size: 9px;
            background: rgba(255,255,255,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #64748b;
        }
        .provider-filter-item.active .pf-count { background: rgba(245,197,24,0.15); color: #f5c518; }

        /* Game Grid for Full Page */
        .game-grid-full {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(15,23,42,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .stats-bar span { font-size: 11px; color: #64748b; font-weight: 600; }
        .stats-bar strong { color: #f5c518; }

        /* Responsive */
        @media (max-width: 900px) {
            .page-layout { grid-template-columns: 1fr; }
            .filter-sidebar { display: none; }
            .game-grid-full { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }
        @media (max-width: 480px) {
            .game-grid-full { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .page-hero h1 { font-size: 20px; }
        }

        /* Mobile Provider Bar (appears on mobile) */
        .mobile-provider-bar {
            display: none;
            overflow-x: auto;
            gap: 6px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .mobile-provider-bar::-webkit-scrollbar { display: none; }
        @media (max-width: 900px) {
            .mobile-provider-bar { display: flex; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-[100] bg-[#0b0e14]/95 border-b border-white/5 px-4 py-3 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='/'">
            <img src="logo.png" alt="CLASH BET" class="h-[76px] xl:h-[84px] object-contain">
        </div>
        <div id="guestNav" class="flex gap-1.5 align-center">
            <button onclick="location.href='/'" class="bg-[#1e293b] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">🏠 ANASAYFA</button>
            <button onclick="location.href='canli-casino.html'" class="bg-[#9333ea] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">🃏 CANLI CASİNO</button>
            <button onclick="location.href='spor.html'" class="bg-[#16a34a] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">⚽ SPOR</button>
            <button onclick="openModal('loginModal')" class="bg-[#2563eb] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">GİRİŞ YAP</button>
            <button onclick="openModal('registerModal')" class="bg-[#f5c518] clash-btn text-black text-[9px] font-black px-3 py-1.5 rounded-lg">ÜYE OL</button>
        </div>
        <div id="userNav" class="hidden flex items-center gap-2">
            <button onclick="location.href='/'" class="bg-[#1e293b] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">🏠</button>
            <button onclick="location.href='canli-casino.html'" class="bg-[#9333ea] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">🃏 CASİNO</button>
            <button onclick="location.href='spor.html'" class="bg-[#16a34a] clash-btn text-white text-[9px] font-bold px-3 py-1.5 rounded-lg">⚽ SPOR</button>
            <div onclick="openModal('profileModal')" class="bg-black/50 border border-[#f5c518] px-3 py-1.5 rounded-lg text-right cursor-pointer hover:bg-black/70 transition-colors">

            </div>
        </div>

    <div class="page-container">
        <!-- Hero -->
        <div class="page-hero" style="margin-top: 16px;">
            <div class="page-hero-content">
                <div class="flex items-center gap-3">
                    <div class="casino-icon">🎰</div>
                    <div>
                        <h1>SLOT OYUNLARI</h1>
                        <p id="slotPageCount">Yükleniyor...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="search-box-lg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="Oyun adı veya sağlayıcı ara..." oninput="handleSearch(this.value)">
            </div>
            <select class="sort-select" id="sortSelect" onchange="handleSort(this.value)">
                <option value="default">Sıralama</option>
                <option value="popular">🔥 Popüler</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="provider">Sağlayıcıya Göre</option>
            </select>
        </div>

        <!-- Casino Tabs -->
        <div class="casino-tabs" style="margin-bottom: 10px;">
            <button class="casino-tab active" data-cat="all" onclick="setCategory('all', this)"><span class="casino-tab-icon">⭐</span> Tümü</button>
            <button class="casino-tab" data-cat="slots" onclick="setCategory('slots', this)"><span class="casino-tab-icon">🎰</span> Slotlar</button>
            <button class="casino-tab" data-cat="live" onclick="setCategory('live', this)"><span class="casino-tab-icon">🃏</span> Canlı</button>
            <button class="casino-tab" data-cat="table" onclick="setCategory('table', this)"><span class="casino-tab-icon">🎲</span> Masa</button>
            <button class="casino-tab" data-cat="popular" onclick="setCategory('popular', this)"><span class="casino-tab-icon">🔥</span> Popüler</button>
        </div>

        <!-- Mobile Provider Bar -->
        <div class="mobile-provider-bar" id="mobileProviderBar"></div>

        <!-- Stats -->
        <div class="stats-bar">
            <span id="resultCount">Yükleniyor...</span>
            <span>Kaynak: <strong id="sourceTag">—</strong></span>

        <!-- Layout -->
        <div class="page-layout">
            <!-- Sidebar -->
            <aside class="filter-sidebar">
                <h3>🏢 Sağlayıcılar</h3>
                <div class="provider-filter-list" id="providerSidebar">
                    <button class="provider-filter-item active" onclick="setProvider('all', this)">
                        <span>Tüm Sağlayıcılar</span>
                    </button>
                </div>
            </aside>

            <!-- Game Grid -->
            <div>
                <div class="game-grid-full" id="gameGrid">
                    <div class="slot-skeleton"></div><div class="slot-skeleton"></div><div class="slot-skeleton"></div>
                    <div class="slot-skeleton"></div><div class="slot-skeleton"></div><div class="slot-skeleton"></div>
                    <div class="slot-skeleton"></div><div class="slot-skeleton"></div><div class="slot-skeleton"></div>
                    <div class="slot-skeleton"></div>
                </div>

                <!-- Load More -->
                <div class="casino-load-more" id="loadMoreBox" style="display:none;">
                    <button class="casino-load-btn" id="loadMoreBtn" onclick="loadMore()">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="mobile-nav">
        <div class="nav-item" onclick="location.href='/'"><div class="nav-icon">🏠</div><span>Anasayfa</span></div>
        <div class="nav-item active"><div class="nav-icon">🎰</div><span style="color:#f5c518;font-weight:700;">Slotlar</span></div>
        <div class="nav-item" onclick="location.href='canli-casino.html'"><div class="nav-icon">🃏</div><span>Canlı Casino</span></div>
        <div class="nav-item" onclick="location.href='spor.html'"><div class="nav-icon">⚽</div><span>Spor</span></div>

    <!-- Game Modal -->

            <div class="modal-header" style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:#111318;">
                <span class="modal-title" id="activeGameName" style="font-size:13px;">Yükleniyor...</span>
                <span class="close-btn" onclick="closeGameModal()" style="font-size:22px;">&times;</span>

            <iframe id="gameFrame" style="width:100%;height:calc(100% - 40px);border:none;background:#000;" src="about:blank" allowfullscreen></iframe>

    <!-- Auth Warning Modal -->

        <div class="modal-content p-6 text-center" style="max-width:380px;">
            <button onclick="closeModals()" class="absolute top-3 right-4 text-2xl text-gray-400 hover:text-gray-200">&times;</button>
            <div style="font-size:50px;margin-bottom:12px;">🔐</div>
            <h2 class="text-lg font-black text-white mb-2">Giriş Yapmalısınız</h2>
            <p class="text-xs text-gray-400 mb-4">Oyun oynamak için giriş yapın veya üye olun.</p>
            <div class="flex gap-2 justify-center">
                <button onclick="closeModals();openModal('loginModal')" class="bg-[#2563eb] text-white px-4 py-2 rounded-lg text-xs font-bold">GİRİŞ YAP</button>
                <button onclick="closeModals();openModal('registerModal')" class="bg-[#f5c518] text-black px-4 py-2 rounded-lg text-xs font-black">KAYIT OL</button>
            </div>
        </div>
    </div>

    <!-- Login/Register Modals (minimal) -->
    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:360px;padding:24px;">
            <span class="close-btn" onclick="closeModals()" style="position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;">&times;</span>
            <h3 class="text-white text-lg font-black mb-4">🔑 GİRİŞ YAP</h3>
            <input type="text" id="loginUser" placeholder="Kullanıcı Adı" class="w-full px-4 py-2.5 rounded-lg bg-[#0f1219] border border-white/10 text-white placeholder-gray-500 text-sm mb-3">
            <input type="password" id="loginPass" placeholder="Şifre" class="w-full px-4 py-2.5 rounded-lg bg-[#0f1219] border border-white/10 text-white placeholder-gray-500 text-sm mb-4">
            <button onclick="doLogin()" class="w-full bg-[#2563eb] text-white py-2.5 rounded-xl font-bold text-sm">GİRİŞ YAP</button>
        </div>
    </div>
    <div id="registerModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:360px;padding:24px;">
            <span class="close-btn" onclick="closeModals()" style="position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;">&times;</span>
            <h3 class="text-white text-lg font-black mb-4">📝 KAYIT OL</h3>
            <input type="text" id="regUser" placeholder="Kullanıcı Adı" class="w-full px-4 py-2.5 rounded-lg bg-[#0f1219] border border-white/10 text-white placeholder-gray-500 text-sm mb-3">
            <input type="password" id="regPass" placeholder="Şifre" class="w-full px-4 py-2.5 rounded-lg bg-[#0f1219] border border-white/10 text-white placeholder-gray-500 text-sm mb-4">
            <button onclick="doRegister()" class="w-full bg-[#f5c518] text-black py-2.5 rounded-xl font-black text-sm">KAYIT OL</button>
        </div>
    </div>

<script>
// ===== State =====
let state = { games: [], page: 1, totalPages: 1, total: 0, category: 'all', provider: 'all', search: '', sort: 'default', providers: [], loading: false };
let favorites = JSON.parse(localStorage.getItem('favGames')) || [];

// ===== Auth =====
function checkAuth(action) {
    const u = localStorage.getItem('currentUser');
    if (!u) { openModal('authWarningModal'); return false; }
    if (action === 'profile') openModal('profileModal');
    return true;
}
function initAuth() {
    const u = JSON.parse(localStorage.getItem('currentUser'));
    if (u) {
        document.getElementById('guestNav').classList.add('hidden');
        document.getElementById('userNav').classList.remove('hidden');
        document.getElementById('navUserName').textContent = u.username || u.user;
        document.getElementById('mainBalance').textContent = (u.balance || 0).toFixed(2) + ' TL';
    }
}
async function doLogin() {
    const user = document.getElementById('loginUser').value;
    const pass = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user, pass}) });
    const data = await res.json();
    if (data.success) { localStorage.setItem('currentUser', JSON.stringify(data.user)); localStorage.setItem('token', data.token); location.reload(); }
    else alert(data.message);
}
async function doRegister() {
    const user = document.getElementById('regUser').value;
    const pass = document.getElementById('regPass').value;
    const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user, pass}) });
    const data = await res.json();
    if (data.success) { localStorage.setItem('currentUser', JSON.stringify(data.user)); localStorage.setItem('token', data.token); location.reload(); }
    else alert(data.message);
}

// ===== Modal Helpers =====
function openModal(id) { const m = document.getElementById(id); if (m) { m.style.display = 'flex'; m.classList.add('active'); } }
function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.style.display = 'none'; m.classList.remove('active'); }); }
function closeGameModal() { document.getElementById('gameFrame').src = 'about:blank'; closeModals(); }

// ===== Game Loading =====
async function loadGames(append = false) {
    if (state.loading) return;
    state.loading = true;
    const grid = document.getElementById('gameGrid');
    const btn = document.getElementById('loadMoreBtn');
    if (!append) { grid.innerHTML = ''; for (let i = 0; i < 10; i++) grid.innerHTML += '<div class="slot-skeleton"></div>'; }
    if (btn) btn.innerHTML = '<span>YÜKLENİYOR...</span>';

    try {
        let url = `/api/veritral/games?page=${state.page}&limit=30`;
        if (state.provider !== 'all') url += `&provider=${encodeURIComponent(state.provider)}`;
        if (state.category !== 'all' && state.category !== 'popular') url += `&category=${state.category}`;
        if (state.search) url += `&search=${encodeURIComponent(state.search)}`;

        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) return;

        let games = data.games || [];
        if (state.category === 'popular') games = games.filter(g => g.popular);

        // Sort
        if (state.sort === 'az') games.sort((a,b) => a.name.localeCompare(b.name));
        else if (state.sort === 'za') games.sort((a,b) => b.name.localeCompare(a.name));
        else if (state.sort === 'provider') games.sort((a,b) => a.provider.localeCompare(b.provider));
        else if (state.sort === 'popular') games.sort((a,b) => (b.popular?1:0) - (a.popular?1:0));

        state.total = data.total;
        state.totalPages = data.totalPages;

        // Providers (first load)
        if (data.providers && data.providers.length > 0 && state.providers.length === 0) {
            state.providers = data.providers;
            renderProviders();
        }

        // Count
        document.getElementById('slotPageCount').textContent = `${data.total}+ Oyun • ${state.providers.length} Sağlayıcı`;
        document.getElementById('resultCount').textContent = `${games.length} oyun gösteriliyor (toplam ${data.total})`;
        document.getElementById('sourceTag').textContent = data.source === 'veritral' ? 'Veritral API' : 'Katalog';

        if (!append) grid.innerHTML = '';
        if (games.length === 0 && !append) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-500 text-sm py-16">Bu filtrelere uygun oyun bulunamadı.</div>';
        } else {
            games.forEach(g => {
                const isFav = favorites.includes(g.id);
                const safeName = (g.name||'').replace(/'/g, "\\'");
                grid.innerHTML += `<div class="slot-card" onclick="launchGame('${g.id}','${safeName}')">
                    <img src="${g.image}" loading="lazy" alt="${g.name}" onerror="this.src='https://via.placeholder.com/300x400/1e293b/f5c518?text=${encodeURIComponent(g.name)}'">
                    <div class="game-provider-tag">${g.provider}</div>
                    <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav('${g.id}',event)">♥</div>
                    <div class="game-name-tag">${g.name}</div>
                    <div class="play-overlay"><span class="bg-[#f5c518] text-black font-black px-3 py-1 rounded-full text-[10px]">OYNA</span></div>
                </div>`;
            });
        }

        document.getElementById('loadMoreBox').style.display = state.page < state.totalPages ? 'block' : 'none';
    } catch (e) {
        console.error(e);
        if (!append) grid.innerHTML = '<div class="col-span-full text-center text-red-400 text-sm py-16">Oyunlar yüklenirken hata oluştu.</div>';
    } finally {
        state.loading = false;
        if (btn) btn.innerHTML = '<span>DAHA FAZLA OYUN YÜKLE</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>';
    }
}

function renderProviders() {
    // Sidebar
    let html = `<button class="provider-filter-item ${state.provider==='all'?'active':''}" onclick="setProvider('all',this)"><span>Tüm Sağlayıcılar</span></button>`;
    // Mobile bar
    let mHtml = `<button class="provider-chip ${state.provider==='all'?'active':''}" onclick="setProvider('all',this)">Tümü</button>`;
    // Fetch counts
    fetch('/api/veritral/providers').then(r=>r.json()).then(d => {
        if (!d.success) return;
        d.providers.forEach(p => {
            const active = state.provider === p.name ? 'active' : '';
            const esc = p.name.replace(/'/g, "\\'");
            html += `<button class="provider-filter-item ${active}" onclick="setProvider('${esc}',this)"><span>${p.name}</span><span class="pf-count">${p.count}</span></button>`;
            mHtml += `<button class="provider-chip ${active}" onclick="setProvider('${esc}',this)">${p.name}</button>`;
        });
        document.getElementById('providerSidebar').innerHTML = html;
        document.getElementById('mobileProviderBar').innerHTML = mHtml;
    });
}

// ===== Filters =====
function setCategory(cat, btn) { state.category = cat; state.page = 1; document.querySelectorAll('.casino-tab').forEach(t=>t.classList.remove('active')); if(btn) btn.classList.add('active'); loadGames(); }
function setProvider(prov, btn) {
    state.provider = prov; state.page = 1;
    document.querySelectorAll('.provider-filter-item, .provider-chip').forEach(c=>c.classList.remove('active'));
    if(btn) btn.classList.add('active');
    // Sync both sidebar and mobile
    document.querySelectorAll(`[onclick*="setProvider('${prov.replace(/'/g,"\\'")}"]`).forEach(b=>b.classList.add('active'));
    loadGames();
}
let searchTimer;
function handleSearch(v) { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.search = v; state.page = 1; loadGames(); }, 300); }
function handleSort(v) { state.sort = v; state.page = 1; loadGames(); }
function loadMore() { if (state.page < state.totalPages) { state.page++; loadGames(true); } }

// ===== Fav =====
function toggleFav(id, e) {
    e.stopPropagation();
    const idx = favorites.indexOf(id);
    if (idx > -1) { favorites.splice(idx, 1); e.currentTarget.classList.remove('active'); }
    else { favorites.push(id); e.currentTarget.classList.add('active'); }
    localStorage.setItem('favGames', JSON.stringify(favorites));
}

// ===== Launch =====
async function launchGame(gameId, gameName) {
    if (!localStorage.getItem('currentUser')) { openModal('authWarningModal'); return; }
    document.getElementById('activeGameName').textContent = 'Yükleniyor...';
    document.getElementById('gameFrame').src = 'about:blank';
    openModal('gameModal');
    try {
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/launch-game?gameId=${gameId}`, { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.success && data.launchUrl) {
            document.getElementById('gameFrame').src = data.launchUrl;
            document.getElementById('activeGameName').textContent = gameName;
        } else { alert(data.message || 'Oyun başlatılamadı!'); closeGameModal(); }
    } catch (e) { console.error(e); alert('Hata oluştu.'); closeGameModal(); }
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => { initAuth(); loadGames(); });
</script>
