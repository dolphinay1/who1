<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Interactive Skills Hover Grid</title> <style> @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono&display=swap'); :root { --bg-color: #0a0a0a; --text-dim: #3a3a3a; --text-normal: #888888; --text-active: #ffffff; --desc-color: #888888; --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace; } body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; } .skills-wrapper { max-width: 900px; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; align-items: center; } .skills-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem 2rem; max-width: 800px; } .skill-item { font-family: var(--font-sans); font-size: 16px; font-weight: 500; color: var(--text-normal); cursor: pointer; user-select: none; transition: color 0.25s ease, font-size 0.25s cubic-bezier(0.16, 1, 0.3, 1); } .skills-grid:hover .skill-item { color: var(--text-dim); } .skills-grid .skill-item:hover { color: var(--text-active); font-size: 24px; } .skills-desc { margin-top: 2.5rem; font-family: var(--font-mono); font-size: 12px; color: var(--desc-color); min-height: 20px; text-align: center; letter-spacing: 0.04em; opacity: 0; transition: opacity 0.2s ease; } .skills-desc.active { opacity: 1; } </style> </head> <body> <div class="skills-wrapper"> <div class="skills-grid"> <span class="skill-item" data-desc="Systems programming, CLI tools, high-performance services">Go</span> <span class="skill-item" data-desc="Machine learning, data pipelines, backend APIs">Python</span> <span class="skill-item" data-desc="Full-stack development, interactive UI, Electron apps">TypeScript</span> <span class="skill-item" data-desc="Native iOS/macOS development, local AI embeddings">Swift</span> <span class="skill-item" data-desc="Model training, fine-tuning, neural networks">PyTorch</span> <span class="skill-item" data-desc="Component architectures, dynamic state, web applications">React</span> <span class="skill-item" data-desc="Server-side rendering, static generation, API routes">Next.js</span> <span class="skill-item" data-desc="3D graphics, WebGL animations, interactive visualizers">Three.js</span> <span class="skill-item" data-desc="Local LLM orchestration, model deployment, offline inference">Ollama</span> <span class="skill-item" data-desc="Retrieval-Augmented Generation, vector embeddings, semantic search">RAG</span> <span class="skill-item" data-desc="Cloud data warehousing, big data analytics, SQL processing">Snowflake</span> <span class="skill-item" data-desc="Cloud infrastructure, deployment">AWS</span> <span class="skill-item" data-desc="Containerization, reproducible environments, microservices">Docker</span> <span class="skill-item" data-desc="Relational database design, query optimization">SQL</span> <span class="skill-item" data-desc="LLM agents, chain execution, prompts engineering">LangChain</span> <span class="skill-item" data-desc="Desktop cross-platform client development">Electron</span> </div> <div class="skills-desc"></div> </div> <script> document.addEventListener("DOMContentLoaded", () => { const items = document.querySelectorAll(".skill-item"); const descBox = document.querySelector(".skills-desc"); items.forEach(item => { item.addEventListener("mouseenter", () => { const desc = item.getAttribute("data-desc"); descBox.textContent = desc; descBox.classList.add("active"); }); item.addEventListener("mouseleave", () => { descBox.classList.remove("active"); }); }); }); </script> </body> </html>
